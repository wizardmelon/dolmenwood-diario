name: Pubblica il sito su GitHub Pages

# Il sito è statico: non c'è nessun passaggio di build, si carica la cartella
# sito/ così com'è. (Pages, se configurato da branch, saprebbe pubblicare solo
# la radice o docs/: questo workflow permette di tenere la cartella sito/.)

on:
  push:
    branches: [main]
    paths:
      - "sito/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: deploy
        uses: actions/deploy-pages@v4
